name: Release custom Collector

on:
  push:
    tags:
      - 'v*.*.*-groundcover.*'

permissions:
  contents: read

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify tag and pinned upstream versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-groundcover\.([0-9]+)$ ]]; then
            echo "unexpected release tag: $tag" >&2
            exit 1
          fi
          release_upstream="${BASH_REMATCH[1]}"
          . collector-builder/versions.env
          if [[ "$release_upstream" != "$OTEL_VERSION" ]]; then
            echo "tag upstream ${release_upstream} does not match pinned ${OTEL_VERSION}" >&2
            exit 1
          fi
          echo "go=${GO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      - name: Build custom Collector
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: ./collector-builder/build.sh

      - name: Package binary
        id: package
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ steps.versions.outputs.release_version }}
        run: |
          set -euo pipefail
          package_base="otelcol-azure-sql_${RELEASE_VERSION}_linux_${ARCH}"
          stage="collector-builder/.build/package/${package_base}"
          mkdir -p "$stage"
          install -m 0755 collector-builder/dist/otelcol-azure-sql \
            "${stage}/otelcol-azure-sql"
          archive="collector-builder/dist/${package_base}.tar.gz"
          tar \
            --sort=name \
            --mtime="@${SOURCE_DATE_EPOCH:-0}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$archive" \
            -C "$(dirname "$stage")" \
            "$(basename "$stage")"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sbom=collector-builder/dist/${package_base}.spdx.json" >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: collector-builder/dist/otelcol-azure-sql
          format: spdx-json
          output-file: ${{ steps.package.outputs.sbom }}
          upload-artifact: false
          upload-release-assets: false

      - name: Upload release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.sbom }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-linux-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            LC_ALL=C sha256sum ./*.tar.gz ./*.spdx.json > SHA256SUMS
          )

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="otelcol-azure-sql ${GITHUB_REF_NAME}"
          notes="$(cat <<EOF
          Custom OpenTelemetry Collector for Azure SQL Microsoft Entra authentication.

          Upstream Collector/contrib version: ${GITHUB_REF_NAME%%-groundcover.*}
          The release contains linux/amd64 and linux/arm64 archives, SPDX SBOMs,
          checksums, and GitHub artifact attestations.
          EOF
          )"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --verify-tag \
              --title "$title" \
              --notes "$notes"
          fi
