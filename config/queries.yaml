  # Additional database examples. Uncomment a receiver, replace its connection
  # placeholders, then add its receiver ID to service.pipelines.metrics.receivers.
  #
  # The query list can name any anchor defined above. Only
  # `*query_azure_sql_backups` is anchored by default; enabling the commented
  # activity-batch example restores `*query_activity_batch_summary` and
  # `*query_tenant_pending` for use here too.
  #
  # sqlquery/secondary:
  #   driver: azuresql
  #   datasource: "sqlserver://<SECOND_SQL_SERVER_FQDN>:1433?database=<SECOND_SQL_DATABASE>&fedauth=ActiveDirectoryManagedIdentity&user+id=${env:AZURE_MANAGED_IDENTITY_CLIENT_ID:-}&encrypt=true&TrustServerCertificate=false"
  #   # Stock SQL-auth replacement: use driver/host/port/database/username/
  #   # password/additional_params exactly as shown for sqlquery/primary.
  #   collection_interval: ${env:SQL_COLLECTION_INTERVAL:-60s}
  #   initial_delay: 5s
  #   timeout: 30s
  #   max_open_conn: 2
  #   queries: [*query_azure_sql_backups]
  #
  # sqlquery/secondary-backups:
  #   driver: azuresql
  #   datasource: "sqlserver://<BACKUP_SQL_SERVER_FQDN>:1433?database=<BACKUP_SQL_DATABASE>&fedauth=ActiveDirectoryManagedIdentity&user+id=${env:AZURE_MANAGED_IDENTITY_CLIENT_ID:-}&encrypt=true&TrustServerCertificate=false"
  #   # Stock SQL-auth replacement: use driver/host/port/database/username/
