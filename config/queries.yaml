# Native sqlquery receiver configuration. Load after collector.yaml.
# This is the only place customer SQL and SQL-to-metric mappings belong.
#
# Any T-SQL that returns numeric columns can become a metric: a plain SELECT, a
# CTE, a DMV read, or an EXEC of a procedure that returns a rowset. The active
# query below reads Azure SQL backup history and works on any Azure SQL
# Database, so it is safe to keep while you add your own.
#
# Query objects are anchored so additional database receivers can reuse them
# without copying SQL or metric mappings.

receivers:
  sqlquery/primary:
    driver: azuresql
    datasource: "sqlserver://<SQL_SERVER_FQDN>:1433?database=<SQL_DATABASE>&fedauth=ActiveDirectoryManagedIdentity&user+id=${env:AZURE_MANAGED_IDENTITY_CLIENT_ID:-}&encrypt=true&TrustServerCertificate=false"

    # Stock otelcol-contrib SQL-auth replacement:
    # Remove `driver` and `datasource` above, then uncomment this block.
    # driver: sqlserver
    # host: <SQL_SERVER_FQDN>
    # port: 1433
    # database: <SQL_DATABASE>
    # username: ${env:SQL_USERNAME}
    # password: ${env:SQL_PASSWORD}
    # additional_params:
    #   encrypt: "true"
    #   TrustServerCertificate: "false"

    collection_interval: ${env:SQL_COLLECTION_INTERVAL:-60s}
    initial_delay: 5s
    timeout: 30s
    max_open_conn: 2
    queries:
      # Add your own query here. Any T-SQL that returns numeric columns works:
      # SELECT, CTEs, DMV reads, or EXEC of a procedure returning a rowset.
      # See docs/adding-custom-queries.md for the full field reference.
      #
      # - sql: |
      #     SELECT
      #       COUNT_BIG(*) AS open_orders,
      #       CAST(MAX(DATEDIFF(SECOND, OrderDate, SYSUTCDATETIME())) AS FLOAT)
      #         AS oldest_seconds,
      #       Region
      #     FROM dbo.Orders
      #     WHERE ShippedDate IS NULL
      #     GROUP BY Region;
      #   ignore_null_values: true
      #   metrics:
      #     - metric_name: app.orders.open
      #       value_column: open_orders
      #       attribute_columns: [Region]
      #       data_type: gauge
      #       value_type: int
      #       description: Unshipped orders by region.
      #       unit: "{order}"
      #     - metric_name: app.orders.oldest_open
      #       value_column: oldest_seconds
      #       attribute_columns: [Region]
      #       data_type: gauge
      #       value_type: double
      #       description: Age of the oldest unshipped order by region.
      #       unit: s

      # Azure SQL Database backup health. `dbname` is the DMV-provided label.
      # The DMV returns no rows on Hyperscale. A value of 999999 means that
      # backup type has never completed.
      - &query_azure_sql_backups
        sql: |
          WITH target AS (
            SELECT DB_NAME() AS dbname
          ),
          backups AS (
            SELECT logical_database_name AS dbname, backup_type, backup_finish_date
            FROM sys.dm_database_backups
          ),
          lasts AS (
            SELECT
              target.dbname,
              MAX(CASE WHEN backups.backup_type = 'D' THEN backups.backup_finish_date END) AS lastfull,
              MAX(CASE WHEN backups.backup_type = 'I' THEN backups.backup_finish_date END) AS lastdiff,
              MAX(CASE WHEN backups.backup_type = 'L' THEN backups.backup_finish_date END) AS lastlog
            FROM target
            LEFT JOIN backups ON backups.dbname = target.dbname
            GROUP BY target.dbname
          ),
          counts AS (
            SELECT
              target.dbname,
              SUM(CASE WHEN backups.backup_type = 'D' AND backups.backup_finish_date >= DATEADD(DAY, -7, GETUTCDATE()) THEN 1 ELSE 0 END) AS fullbackups7dcount,
              SUM(CASE WHEN backups.backup_type = 'I' AND backups.backup_finish_date >= DATEADD(DAY, -2, GETUTCDATE()) THEN 1 ELSE 0 END) AS diffbackups2dcount,
              SUM(CASE WHEN backups.backup_type = 'L' AND backups.backup_finish_date >= DATEADD(DAY, -1, GETUTCDATE()) THEN 1 ELSE 0 END) AS logbackups24hcount
            FROM target
            LEFT JOIN backups ON backups.dbname = target.dbname
            GROUP BY target.dbname
          )
          SELECT
            DB_NAME() AS db_name,
            CAST(SERVERPROPERTY('ServerName') AS nvarchar(128)) AS sql_server_name,
            l.dbname,
            ISNULL(CAST(DATEDIFF(HOUR, l.lastfull, GETUTCDATE()) AS FLOAT), 999999) AS lastfullagehours,
            ISNULL(CAST(DATEDIFF(HOUR, l.lastdiff, GETUTCDATE()) AS FLOAT), 999999) AS lastdiffagehours,
            ISNULL(CAST(DATEDIFF(HOUR, l.lastlog, GETUTCDATE()) AS FLOAT), 999999) AS lastlogagehours,
            CAST(CASE WHEN l.lastfull >= DATEADD(DAY, -7, GETUTCDATE()) THEN 1 ELSE 0 END AS FLOAT) AS hasfullbackuplast7days,
            CAST(CASE WHEN l.lastdiff >= DATEADD(DAY, -2, GETUTCDATE()) THEN 1 ELSE 0 END AS FLOAT) AS hasdiffbackuplast2days,
            CAST(CASE WHEN l.lastlog >= DATEADD(HOUR, -1, GETUTCDATE()) THEN 1 ELSE 0 END AS FLOAT) AS haslogbackuplast60min,
            CAST(c.fullbackups7dcount AS FLOAT) AS fullbackups7dcount,
            CAST(c.diffbackups2dcount AS FLOAT) AS diffbackups2dcount,
            CAST(c.logbackups24hcount AS FLOAT) AS logbackups24hcount
          FROM lasts l
          JOIN counts c ON c.dbname = l.dbname
          ORDER BY l.dbname;
        ignore_null_values: true
        metrics:
          - metric_name: azure_sql_backups.last_full_age_hours
            value_column: lastfullagehours
            attribute_columns: [dbname, db_name, sql_server_name]
            data_type: gauge
            value_type: double
            description: Age in hours of the most recent full backup by database; 999999 means no full backup exists.
            unit: "h"
            static_attributes:
              env: ${env:GROUNDCOVER_ENV_NAME}
              metric: azure_sql_backups
          - metric_name: azure_sql_backups.last_diff_age_hours
            value_column: lastdiffagehours
            attribute_columns: [dbname, db_name, sql_server_name]
            data_type: gauge
            value_type: double
            description: Age in hours of the most recent differential backup by database; 999999 means no differential backup exists.
            unit: "h"
            static_attributes:
              env: ${env:GROUNDCOVER_ENV_NAME}
              metric: azure_sql_backups
          - metric_name: azure_sql_backups.last_log_age_hours
            value_column: lastlogagehours
            attribute_columns: [dbname, db_name, sql_server_name]
            data_type: gauge
            value_type: double
            description: Age in hours of the most recent log backup by database; 999999 means no log backup exists.
            unit: "h"
            static_attributes:
              env: ${env:GROUNDCOVER_ENV_NAME}
              metric: azure_sql_backups
          - metric_name: azure_sql_backups.has_full_backup_last_7d
            value_column: hasfullbackuplast7days
            attribute_columns: [dbname, db_name, sql_server_name]
            data_type: gauge
            value_type: double
            description: 1 when a full backup completed in the last 7 days, otherwise 0.
            unit: "1"
            static_attributes:
              env: ${env:GROUNDCOVER_ENV_NAME}
              metric: azure_sql_backups
          - metric_name: azure_sql_backups.has_diff_backup_last_2d
            value_column: hasdiffbackuplast2days
            attribute_columns: [dbname, db_name, sql_server_name]
            data_type: gauge
            value_type: double
            description: 1 when a differential backup completed in the last 2 days, otherwise 0.
            unit: "1"
            static_attributes:
              env: ${env:GROUNDCOVER_ENV_NAME}
              metric: azure_sql_backups
          - metric_name: azure_sql_backups.has_log_backup_last_60m
            value_column: haslogbackuplast60min
            attribute_columns: [dbname, db_name, sql_server_name]
            data_type: gauge
            value_type: double
            description: 1 when a log backup completed in the last 60 minutes, otherwise 0.
            unit: "1"
            static_attributes:
              env: ${env:GROUNDCOVER_ENV_NAME}
              metric: azure_sql_backups
          - metric_name: azure_sql_backups.full_backups_7d_count
            value_column: fullbackups7dcount
            attribute_columns: [dbname, db_name, sql_server_name]
            data_type: gauge
            value_type: double
            description: Full backup count during the last 7 days by database.
            unit: "{backup}"
            static_attributes:
              env: ${env:GROUNDCOVER_ENV_NAME}
              metric: azure_sql_backups
          - metric_name: azure_sql_backups.diff_backups_2d_count
            value_column: diffbackups2dcount
            attribute_columns: [dbname, db_name, sql_server_name]
            data_type: gauge
            value_type: double
            description: Differential backup count during the last 2 days by database.
            unit: "{backup}"
            static_attributes:
              env: ${env:GROUNDCOVER_ENV_NAME}
              metric: azure_sql_backups
          - metric_name: azure_sql_backups.log_backups_24h_count
            value_column: logbackups24hcount
            attribute_columns: [dbname, db_name, sql_server_name]
            data_type: gauge
            value_type: double
            description: Log backup count during the last 24 hours by database.
            unit: "{backup}"
            static_attributes:
              env: ${env:GROUNDCOVER_ENV_NAME}
              metric: azure_sql_backups

      # ---------------------------------------------------------------------
      # OPT-IN EXAMPLE: activity-batch backlog. Not a package feature.
      #
      # These two queries are one application's monitoring, kept here as a
      # worked example of a multi-table, multi-metric query pair. They are
      # commented out because they fail with `Invalid object name` unless the
      # connected database already contains this schema:
      #
      # customer.ActivityRecordBatchInformation with columns Id, TenancyId,
      # UploadDateTime, InsertDateTime, FailedInsertAttempts.
      # customer.Tenancy with columns Id, Reference, ParentTenantId.
      #
      # They also assume a failed-insert retry limit of 50 and, for the tenant
      # query, that row-level security keys off
      # `sp_set_session_context @key=N'IsLogin'`. Adjust both to your own
      # schema rather than adopting them verbatim.
      #
      # The collector principal needs `SELECT ON SCHEMA::customer`; the SQL
      # user scripts in sql/ grant it only when that schema already exists, so
      # rerun the relevant script after creating the schema. To exercise these
      # on a scratch database, seed it with
      # sql/test-fixtures/seed-customer-schema.sql.
      #
      # To enable: strip the `# ` prefix from every line of the two query
      # blocks below. That also restores the
      # `query_activity_batch_summary` and `query_tenant_pending` anchors for
      # the secondary receivers at the bottom of this file.
